<script>

const DIAS_ALERTA = 7; // días antes del vencimiento para pasar a "por vencer"

const CURRENT_USER = { name: 'Juan Pérez Soto', role: 'Encargado de flota', comp: 'Compañía 1ª', initials: 'JP', isAdmin: true };

// Lista de usuarios del sistema (solo visible/editable por administradores)
let USERS = [
  { id: 'u1', name: 'Juan Pérez Soto', email: 'juan.perez@bomberosmelipilla.cl', comp: 'Compañía 1ª', role: 'Administrador', initials: 'JP' },
  { id: 'u2', name: 'Camila Rojas Vega', email: 'camila.rojas@bomberosmelipilla.cl', comp: 'Compañía 2ª', role: 'Encargado de flota', initials: 'CR' },
  { id: 'u3', name: 'Pedro Soto Álvarez', email: 'pedro.soto@bomberosmelipilla.cl', comp: 'Compañía 3ª', role: 'Voluntario', initials: 'PS' }
];

const V = {
  'B-1': { name: 'B-1 · Bomba Melipilla', plate: 'HXPL-21', comp: 'Compañía 1ª', icon: 'ti-truck', nextMaint: '2026-08-22', tipo: 'Carro bomba', anio: '2016', km: '86.420 km' },
  'B-2': { name: 'B-2 · Bomba Los Cerros', plate: 'FRWZ-88', comp: 'Compañía 2ª', icon: 'ti-truck', nextMaint: '2026-09-02', tipo: 'Carro bomba', anio: '2019', km: '54.100 km' },
  'R-1': { name: 'R-1 · Rescate Vehicular', plate: 'KTLM-05', comp: 'Compañía 3ª', icon: 'ti-ambulance', nextMaint: '2026-09-01', tipo: 'Rescate', anio: '2021', km: '22.300 km' },
  'B-3': { name: 'B-3 · Bomba Centro', plate: 'JNPX-47', comp: 'Compañía 4ª', icon: 'ti-truck', nextMaint: '2026-11-15', tipo: 'Carro bomba', anio: '2022', km: '11.800 km' },
  'B-4': { name: 'B-4 · Bomba Forestal', plate: 'DGRT-63', comp: 'Compañía 1ª', icon: 'ti-truck', nextMaint: '2026-12-01', tipo: 'Forestal', anio: '2020', km: '38.900 km' }
};

const HISTORY = {
  'B-1': [
    { date: '14 jun 2026', title: 'Cambio de aceite y filtros', tipo: 'Preventiva', taller: 'Taller Automotriz Sur', detail: '$85.000 · 4L aceite 15W40, filtro de aceite', by: 'Juan Pérez Soto' },
    { date: '2 mar 2026', title: 'Reparación sistema de frenos', tipo: 'Reactiva', taller: 'Taller Diesel Melipilla', detail: '$210.000 · pastillas y disco delantero', by: 'Camila Rojas Vega' },
    { date: '18 nov 2025', title: 'Revisión general y neumáticos', tipo: 'Preventiva', taller: 'Taller Automotriz Sur', detail: '$340.000 · 2 neumáticos traseros', by: 'Juan Pérez Soto' },
    { date: '5 ago 2025', title: 'Mantención bomba de agua', tipo: 'Preventiva', taller: 'Taller especializado Concepción', detail: '$120.000 · sellos y empaquetadura', by: 'Camila Rojas Vega' }
  ],
  'B-2': [
    { date: '20 ago 2026', title: 'Diagnóstico de motor', tipo: 'Reactiva', taller: 'Taller Diesel Melipilla', detail: '$95.000 · revisión de inyectores', by: 'Camila Rojas Vega' },
    { date: '10 feb 2026', title: 'Cambio de correa de distribución', tipo: 'Preventiva', taller: 'Taller Automotriz Sur', detail: '$180.000 · correa y tensores', by: 'Juan Pérez Soto' }
  ],
  'R-1': [
    { date: '30 jul 2026', title: 'Revisión de sistema hidráulico', tipo: 'Preventiva', taller: 'Taller especializado Concepción', detail: '$110.000 · aceite hidráulico y filtros', by: 'Juan Pérez Soto' }
  ],
  'B-3': [
    { date: '5 may 2026', title: 'Mantención de 10.000 km', tipo: 'Preventiva', taller: 'Taller Automotriz Sur', detail: '$70.000 · revisión general', by: 'Camila Rojas Vega' }
  ],
  'B-4': [
    { date: '12 ene 2026', title: 'Revisión de sistema forestal', tipo: 'Preventiva', taller: 'Taller especializado Concepción', detail: '$130.000 · bomba y mangueras', by: 'Juan Pérez Soto' }
  ]
};

function daysUntil(dateStr) {
  return Math.round((new Date(dateStr) - TODAY) / (1000 * 60 * 60 * 24));
}

function getStatus(v) {
  const days = daysUntil(v.nextMaint);
  if (days < 0) {
    return { status: 'danger', label: 'Mantención vencida', sub: `Venció hace ${Math.abs(days)} día${Math.abs(days) === 1 ? '' : 's'}` };
  }
  if (days <= DIAS_ALERTA) {
    return { status: 'amber', label: days === 0 ? 'Vence hoy' : `Vence en ${days} día${days === 1 ? '' : 's'}`, sub: 'Programar mantención' };
  }
  return { status: 'green', label: 'Operativo', sub: `Próxima mantención en ${days} días` };
}

// Lee el parámetro ?id=B-1 de la URL actual
function getVehicleIdFromURL() {
  const params = new URLSearchParams(window.location.search);
  return params.get('id') || 'B-1';
}
</script>
<script>

<script>
  const id = getVehicleIdFromURL();

  function renderDetalle() {
    const v = V[id];

    if (!v) {
      document.getElementById('content').innerHTML = `<p>Vehículo no encontrado. <a href="dashboard.html">Volver al dashboard</a></p>`;
      return;
    }

    const s = getStatus(v);
    document.getElementById('topbar-title').textContent = v.name;
    document.getElementById('topbar-crumb').textContent = `Patente ${v.plate} · ${v.comp}`;

    const lastMaint = (HISTORY[id] || []).slice(0, 3).map(it => `
      <div class="card" style="margin-bottom:10px;">
        <p style="font-size:13px; font-weight:700; margin:0 0 3px;">${it.title}</p>
        <p style="font-size:12px; color:var(--text2); margin:0;">${it.tipo} · ${it.taller} · ${it.date}</p>
      </div>
    `).join('') || `<p style="font-size:13px; color:var(--text2);">Sin registros aún.</p>`;

    const btnOperativo = s.status !== 'green'
      ? `<button type="button" class="btn-secondary" style="width:100%; margin-bottom:10px; border-color:#0F6E56; color:#0F6E56;" onclick="marcarOperativo()">Marcar como operativo</button>`
      : '';

    document.getElementById('content').innerHTML = `
      <a class="back-link" href="dashboard.html"><i class="ti ti-arrow-left"></i>Volver al dashboard</a>
      <div style="display:grid; grid-template-columns:2fr 1fr; gap:20px; align-items:start;">
        <div>
          <div style="margin-bottom:18px;">
            <span class="pill pill-${s.status}">${s.label}</span>
            <span style="font-size:13px; color:var(--text2); margin-left:8px;">${s.sub}</span>
          </div>
          <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:22px;">
            <div class="stat"><p class="lbl">Tipo</p><p style="font-size:15px; font-weight:700; margin:0;">${v.tipo}</p></div>
            <div class="stat"><p class="lbl">Año</p><p style="font-size:15px; font-weight:700; margin:0;">${v.anio}</p></div>
            <div class="stat"><p class="lbl">Kilometraje</p><p style="font-size:15px; font-weight:700; margin:0;">${v.km}</p></div>
          </div>
          <h3 style="font-size:15px; margin:0 0 12px;">Últimas mantenciones</h3>
          ${lastMaint}
        </div>
        <div class="card">
          <p style="font-size:13px; font-weight:700; margin:0 0 12px;">Acciones</p>
          <a class="btn-primary" style="width:100%; margin-bottom:10px;" href="registrar.html?id=${id}">Registrar mantención</a>
          <a class="btn-secondary" style="width:100%; margin-bottom:10px;" href="historial-detalle.html?id=${id}">Ver historial completo</a>
          ${btnOperativo}
        </div>
      </div>
    `;
  }

  window.marcarOperativo = function() {
    const v = V[id];
    if (!v) return;
    const d = new Date(TODAY);
    d.setDate(d.getDate() + 90);
    v.nextMaint = d.toISOString().slice(0, 10);
    renderDetalle();
  };

  renderDetalle();
</script>

<script>
  (function(){
    const menuToggle = document.getElementById("menu-toggle");
    const sidebar = document.querySelector(".sidebar");
    const backdrop = document.getElementById("sidebar-backdrop");
    function closeMenu(){ sidebar.classList.remove("open"); backdrop.classList.remove("open"); }
    if (menuToggle && sidebar && backdrop) {
      menuToggle.addEventListener("click", () => {
        sidebar.classList.toggle("open");
        backdrop.classList.toggle("open");
      });
      backdrop.addEventListener("click", closeMenu);
      sidebar.querySelectorAll("a").forEach(a => a.addEventListener("click", closeMenu));
    }
  })();
</script>
