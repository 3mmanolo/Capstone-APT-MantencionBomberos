  { id: 'u2', name: 'Camila Rojas Vega', email: 'camila.rojas@bomberosmelipilla.cl', comp: 'Compañía 2ª', role: 'Encargado de flota', initials: 'CR' },
  { id: 'u3', name: 'Pedro Soto Álvarez', email: 'pedro.soto@bomberosmelipilla.cl', comp: 'Compañía 3ª', role: 'Voluntario', initials: 'PS' }
];

const V = {
  'B-1': { name: 'B-1 · Bomba Melipilla', plate: 'HXPL-21', comp: 'Compañía 1ª', icon: 'ti-truck', nextMaint: '2026-08-22', tipo: 'Carro bomba', anio: '2016', km: '86.420 km' },
  'B-2': { name: 'B-2 · Bomba Los Cerros', plate: 'FRWZ-88', comp: 'Compañía 2ª', icon: 'ti-truck', nextMaint: '2026-09-02', tipo: 'Carro bomba', anio: '2019', km: '54.100 km' },
  'R-1': { name: 'R-1 · Rescate Vehicular', plate: 'KTLM-05', comp: 'Compañía 3ª', icon: 'ti-ambulance', nextMaint: '2026-09-01', tipo: 'Rescate', anio: '2021', km: '22.300 km' },
  'B-3': { name: 'B-3 · Bomba Centro', plate: 'JNPX-47', comp: 'Compañía 4ª', icon: 'ti-truck', nextMaint: '2026-11-15', tipo: 'Carro bomba', anio: '2022', km: '11.800 km' },
  'B-4': { name: 'B-4 · Bomba Forestal', plate: 'DGRT-63', comp: 'Compañía 1ª', icon: 'ti-truck', nextMaint: '2026-12-01', tipo: 'Forestal', anio: '2020', km: '38.900 km' }
};

const HISTORY = {
  'B-1': [
    { date: '14 jun 2026', title: 'Cambio de aceite y filtros', tipo: 'Preventiva', taller: 'Taller Automotriz Sur', detail: '$85.000 · 4L aceite 15W40, filtro de aceite', by: 'Juan Pérez Soto' },
    { date: '2 mar 2026', title: 'Reparación sistema de frenos', tipo: 'Reactiva', taller: 'Taller Diesel Melipilla', detail: '$210.000 · pastillas y disco delantero', by: 'Camila Rojas Vega' },
    { date: '18 nov 2025', title: 'Revisión general y neumáticos', tipo: 'Preventiva', taller: 'Taller Automotriz Sur', detail: '$340.000 · 2 neumáticos traseros', by: 'Juan Pérez Soto' },

  ],
  'R-1': [

  ],
  'B-3': [
    { date: '5 may 2026', title: 'Mantención de 10.000 km', tipo: 'Preventiva', taller: 'Taller Automotriz Sur', detail: '$70.000 · revisión general', by: 'Camila Rojas Vega' }
  ],
  'B-4': [
    { date: '12 ene 2026', title: 'Revisión de sistema forestal', tipo: 'Preventiva', taller: 'Taller especializado Concepción', detail: '$130.000 · bomba y mangueras', by: 'Juan Pérez Soto' }
  ]
};

function daysUntil(dateStr) {
  return Math.round((new Date(dateStr) - TODAY) / (1000 * 60 * 60 * 24));
}

function getStatus(v) {
  const days = daysUntil(v.nextMaint);
  if (days < 0) {
    return { status: 'danger', label: 'Mantención vencida', sub: `Venció hace ${Math.abs(days)} día${Math.abs(days) === 1 ? '' : 's'}` };
  }
  if (days <= DIAS_ALERTA) {
    return { status: 'amber', label: days === 0 ? 'Vence hoy' : `Vence en ${days} día${days === 1 ? '' : 's'}`, sub: 'Programar mantención' };
  }
  return { status: 'green', label: 'Operativo', sub: `Próxima mantención en ${days} días` };
}

// Lee el parámetro ?id=B-1 de la URL actual
function getVehicleIdFromURL() {
  const params = new URLSearchParams(window.location.search);
  return params.get('id') || 'B-1';
}

<script>

<script>
  const id = getVehicleIdFromURL();
  const v = V[id];
  const items = HISTORY[id] || [];

  if (!v) {
    document.getElementById('content').innerHTML = `<p>Vehículo no encontrado. <a href="historial.html">Volver a la lista</a></p>`;
  } else {
    document.getElementById('topbar-title').textContent = 'Historial · ' + v.name;
    document.getElementById('topbar-crumb').textContent = `Patente ${v.plate} · ${v.comp}`;

    let body;
    if (items.length === 0) {
      body = `
        <div class="card" style="text-align:center; padding:50px 20px; color:var(--text2);">
          <i class="ti ti-file-off" style="font-size:28px;"></i>
          <p style="font-size:13px; margin:10px 0 0;">Este vehículo aún no tiene mantenciones registradas.</p>
        </div>`;
    } else {
      const rows = items.map(it => `
        <tr>
          <td style="color:var(--text2); white-space:nowrap;">${it.date}</td>
          <td style="font-weight:600;">${it.title}</td>
          <td><span class="pill" style="background:${it.tipo === 'Preventiva' ? 'var(--green-bg)' : 'var(--danger-bg)'}; color:${it.tipo === 'Preventiva' ? 'var(--green)' : 'var(--danger)'};">${it.tipo}</span></td>
          <td style="color:var(--text2);">${it.taller}</td>
          <td style="color:var(--text2);">${it.detail}</td>
          <td style="color:var(--text2); white-space:nowrap;"><i class="ti ti-user" style="font-size:13px; margin-right:4px;"></i>${it.by}</td>
        </tr>
      `).join('');
      body = `
        <div class="card" style="padding:0; overflow:hidden;">
          <table>
            <thead><tr><th>Fecha</th><th>Trabajo</th><th>Tipo</th><th>Taller</th><th>Costo / detalle</th><th>Registrado por</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    document.getElementById('content').innerHTML = `
      <a class="back-link" href="historial.html"><i class="ti ti-arrow-left"></i>Volver a la lista de vehículos</a>
      ${body}
    `;
  }
</script>

<script>
  (function(){
    const menuToggle = document.getElementById("menu-toggle");
    const sidebar = document.querySelector(".sidebar");
    const backdrop = document.getElementById("sidebar-backdrop");
    function closeMenu(){ sidebar.classList.remove("open"); backdrop.classList.remove("open"); }
    if (menuToggle && sidebar && backdrop) {
      menuToggle.addEventListener("click", () => {
        sidebar.classList.toggle("open");
        backdrop.classList.toggle("open");
      });
      backdrop.addEventListener("click", closeMenu);
      sidebar.querySelectorAll("a").forEach(a => a.addEventListener("click", closeMenu));
    }
  })();
</script>
